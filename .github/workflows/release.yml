name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: 055d5977c5c67ebba3fbdf0be31f7bcebed029d0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Validate ReleaseBox ref
        run: |
          if ! [[ "$RELEASEBOX_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "RELEASEBOX_REF must be a full immutable commit SHA" >&2
            exit 1
          fi
      - name: Install ReleaseBox
        run: |
          git clone https://github.com/rogerchappel/releasebox.git .releasebox
          git -C .releasebox checkout --detach "$RELEASEBOX_REF"
          npm ci --prefix .releasebox
          npm run build --prefix .releasebox
      - run: npm ci
      - run: npm run release:check
      - name: ReleaseBox readiness check
        run: node .releasebox/bin/releasebox.js check .
      - name: Generate release notes
        run: node .releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md
      - run: npm pack
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: '*.tgz'
